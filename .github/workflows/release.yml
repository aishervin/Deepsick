name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          if [[ ! "${{ github.event.inputs.release_tag }}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([+-].*)?$ ]]; then
            echo "ERROR: release_tag must be semver, for example v1.2.3"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Write Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Install dependencies
        run: npm ci

      - name: Build browser bundles
        run: npm run build

      - name: Build Android web bundle
        run: npm run build:android

      - name: Ensure Gradle wrapper files exist
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Bootstrapping Gradle wrapper..."
            mkdir -p gradle/wrapper
            curl -sSL "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
              -o gradle/wrapper/gradle-wrapper.jar
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "networkTimeout=10000" >> gradle/wrapper/gradle-wrapper.properties
            echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Validate release signing credentials
        env:
          BDS_KEYSTORE_PASSWORD: ${{ secrets.BDS_KEYSTORE_PASSWORD }}
          BDS_KEY_ALIAS: ${{ secrets.BDS_KEY_ALIAS }}
          BDS_KEY_PASSWORD: ${{ secrets.BDS_KEY_PASSWORD }}
        run: |
          test -f android/ci-release.jks || { echo "ERROR: release keystore is missing"; exit 1; }
          test -n "$BDS_KEYSTORE_PASSWORD" || { echo "ERROR: BDS_KEYSTORE_PASSWORD secret is missing"; exit 1; }
          test -n "$BDS_KEY_ALIAS" || { echo "ERROR: BDS_KEY_ALIAS secret is missing"; exit 1; }
          test -n "$BDS_KEY_PASSWORD" || { echo "ERROR: BDS_KEY_PASSWORD secret is missing"; exit 1; }
          echo "Release signing credentials are present. No debug-signing fallback will be allowed."

      - name: Decode Keystore
        env:
          BDS_KEYSTORE: ${{ secrets.BDS_KEYSTORE }}
        run: |
          # If BDS_KEYSTORE is configured, it is the canonical release keystore.
          # Otherwise the checked-in ci-release.jks is used.
          if [ -n "$BDS_KEYSTORE" ]; then
            echo "$BDS_KEYSTORE" | base64 --decode > android/ci-release.jks
          fi
          test -s android/ci-release.jks || { echo "ERROR: release keystore is empty"; exit 1; }

      - name: Build Android APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleRelease -PreleaseTag=${{ github.event.inputs.release_tag }}
        env:
          BDS_KEYSTORE_PASSWORD: ${{ secrets.BDS_KEYSTORE_PASSWORD }}
          BDS_KEY_ALIAS: ${{ secrets.BDS_KEY_ALIAS }}
          BDS_KEY_PASSWORD: ${{ secrets.BDS_KEY_PASSWORD }}

      - name: Verify APK signatures and version
        working-directory: android
        run: |
          for APK_PATH in $(find app/build/outputs/apk/release -name "*.apk"); do
            echo "=================================================="
            echo "Verifying $APK_PATH"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$APK_PATH"
            echo "Certificate fingerprint:"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK_PATH"
            echo "APK version:"
            $ANDROID_HOME/build-tools/34.0.0/aapt dump badging "$APK_PATH" | grep -E "package: name=|versionCode=|versionName=" | head -1
          done

      - name: Debug - List APKs
        working-directory: android
        run: ls -R app/build/outputs/apk/

      - name: Prepare Browser Artifacts
        run: |
          VERSION=${{ github.event.inputs.release_tag }}
          VERSION=${VERSION#v}
          mv better-deepseek-chrome.zip   "better-deepseek-chrome-v${VERSION}.zip"
          mv better-deepseek-firefox.zip  "better-deepseek-firefox-v${VERSION}.zip"

      - name: Create Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: Release ${{ github.event.inputs.release_tag }}
          body: |
            Automated Release for ${{ github.event.inputs.release_tag }}.

            This release includes:
            - Firefox / Chrome Extension Bundles
            - 3 signed Android APKs for different architectures (arm64-v8a, armeabi-v7a, x86_64)

            Android releases use the persistent release signing key and a monotonically increasing versionCode so existing installations can update in place.
          files: |
            better-deepseek-chrome-*.zip
            better-deepseek-firefox-*.zip
            android/app/build/outputs/apk/release/**/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
